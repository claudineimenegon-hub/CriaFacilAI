name: Checagem

on:
  push:
    branches: [main, robo-anuncios, fotos-ampliar-baixar]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/ad-copy-service.test.mjs test/server.test.mjs test/experimental-v3-wearable-detection.test.mjs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analisar app
        run: |
          set +e
          dart analyze --format=machine lib/features/ads lib/features/home lib/features/product_photo lib/core/sharing > analise.txt 2>&1
          while IFS='|' read -r sev type rule file line col len msg; do
            [ -n "$msg" ] && echo "::warning file=${file#$PWD/},line=$line::[$sev] $rule $msg"
          done < analise.txt
          grep -q '^ERROR' analise.txt && exit 1
          exit 0
